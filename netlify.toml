[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = '''
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.plaid.com https://www.google.com https://www.gstatic.com https://www.recaptcha.net;
      connect-src 'self' https://*.plaid.com https://*.plaid.io https://www.google.com https://www.gstatic.com https://www.recaptcha.net wss://www.walletlink.org wss://mainnet.infura.io;
      frame-src https://cdn.plaid.com https://www.google.com https://www.recaptcha.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https:;
    '''
